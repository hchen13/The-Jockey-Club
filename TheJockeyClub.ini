[General]
; F11 opens the settings menu. This toggle affects horse speed, not race mission scheduling.
EnabledOnStartup=1

[UI]
; Native inline portrait/mask/progress layering; requires the bundled LML UI resources.
; Hot reload once per second. 0 restores the legacy approximate sprite overlay for diagnosis.
NativeStandingsPortraits=1
; Independent horse speedometer, km/h. Menu changes persist; default is hidden.
ShowSpeed=0
; In-world highlight of the judged corridor at a circuit/trip station and during its race:
; 0 off (default), 1 edge posts at +-half-width, 2 translucent fill. Drawn only where the
; route judges a corridor (open destination races have none). Edited from F11 > Course corridor.
CorridorHighlight=0
; Draw the racing line the mod computed for the host on the ground in magenta while racing. 0 off, 1 on.
RacingLineHighlight=0
; Debug aid for that line: if it tilts against the slope on hills, set -1 (default 1).
GroundLinePitchSign=1
; SUHM-compatible native font format. Set 0 for plain-text fallback; hot reloads every second.
UseGameFontMarkup=1
; Normalized screen placement below/left of the radar; adjust for custom HUD layouts.
SpeedHudX=0.018
SpeedHudY=0.955
SpeedHudScale=0.24

[CorridorHalfWidth]
; Shared by Arthur's Thoroughbred race and John's Arthur-era overlay.
arthur-camp=6.0
; Per-station override of the judged corridor half-width in metres (5..20, 0.5 steps).
; The key is the station: emerald-valentine, adler-strawberry, valentine-circuit,
; rhodes-vanhorn, veteran-trail, blackwater, new-austin, thoroughbred-circuit. An absent key keeps the route
; file's TrackHalfWidth. Picked up when the course freezes and live from F11 > Course
; corridor (widening at once; a narrowing made during a race counts from the next race).
; The street clearance radius is unrelated to this width. Examples:
; blackwater=12.0
; new-austin=18.0

[Telemetry]
; F11 > Gait probe. While on, the player's mount is sampled twice a second
; to TheJockeyClub-gait.csv (speed, current/desired gait, pitch, ground
; material, the horse's fear/agitation/tired/brave meters, what the mod wrote
; that frame, seconds since the mod last commanded a rear), in and out of
; races, override on or off. F11 > Gait probe mark writes a "# mark N" line
; to separate trials. Read only: nothing here changes the horse.
GaitProbe=0
; Per-race motion recordings in TheJockeyClub-motion/: 10 Hz JSONL, one file per race, covering
; the player, the host and every field entrant. 0 turns them off.
RaceMotionDiagnostics=1
; A recording is evidence for the race being investigated, not an archive. Whenever a new one is
; opened, older race-*.jsonl files are deleted oldest-first until at most this many remain (the
; new one included) and the folder is under this many megabytes; every prune is logged with what
; went and why. 0 disables that one limit. A file renamed to anything but race-*.jsonl is never
; touched, so rename a recording to keep it. TheJockeyClub.log itself moves to TheJockeyClub.log.1
; once it passes 16 MB.
RaceMotionKeepFiles=6
RaceMotionKeepMegabytes=256

[RaceAI]
; F11 > Casual Mode. 1 disables distance-based catch-up and its near +1-level
; burst; 0 keeps catch-up enabled. Base compensation and earned bursts remain.
CasualMode=0
; 1 = legacy off-screen simulated fallback. 0 = continuous native tasks for the next race,
; including bookmaker events; distant native route movement is logged every 3 seconds.
; Sampled at GO, never switched while a rider owns a suspended navigation task.
FarCatchUp=0
; Native-only speed trial: use waypoint playback's absolute-m/s input for a
; collision-sleeping horse at least 65 m away, at full effort, with valid progress.
; The existing horse plan/burst gate supplies the target; no coordinate/velocity writes.
; 0 restores the stock native gait request. Sampled at GO. FarCatchUp must be 0.
; The discarded FarNativeEffort >3 trial was clamped by the engine and is no longer read.
NativeFarSpeed=1
; Controlled 1491.50 trial: extend ONLY owned sleeping racers' private native
; gallop tables. Restore on wake/end/task changes; never edit global archetypes.
; Off by default until real movement and cleanup have been verified in-game.
NativeSpeedTable=0
; Diagnostic only: alternate 6 s native rate 1.00 / up to 1.15 on owned
; sleeping racers. Logs accepted field readback AND world motion separately.
; NativeSpeedTable must be 0; native continuous navigation remains in control.
; Disabled in the distributed defaults until the native consumer is verified.
NativeMoveRateTrial=0
; Accepted native-vector speed compensation; ALL owned sleeping racers. Keeps
; native route/direction/tasks, scales XY output, never relocates actors.
; Expires after 200 ms without a fresh eligible race frame. Mutually exclusive
; with table/rate trials. Applies to duel/breed hosts, extra field entrants,
; WFA/handicap jockeys and original encounter racers. Their own plans, bursts
; and qualified catch-up set targets. 0 disables this compensation.
; Legacy NativeVectorTrial is read only when NativeVectorSpeed is absent.
NativeVectorSpeed=1
; Read at acceptance, applies to every race opponent. 100 = full competitive effort.
; Lower values reduce native gait request, not horse attributes. No player-gap rubber band.
SkillPercent=100
; How much of the legal corridor the rivals' racing line uses on a corridor race: 0 rides the recorded
; centreline exactly, 100 the full width minus a tracking margin (out-in-out through the bends).
; Read at race start; a change made during a race through the settings API rebuilds the lines live.
RacingLinePercent=100
; Per-side NPC tracking reserve, stored as integer centimetres (0..500; 150 = 1.5 m).
; Read once when the next race/quotation is prepared.
; F11 > Course corridor > NPC tracking margin edits this without recompiling or restarting the game.
TrackingMarginCentimetres=150
; 1 slows the rivals' pace plan where their line threads a gap narrower than 6 m between surveyed
; obstacles (by the gap's half-width, down to 21.6 km/h with no room). 0 leaves the gaps to the line
; and the bends to the cornering model. Read at race start. Learning obstacles from a collision is
; always on.
GapSpeedCaps=0
; With the caps on, the plan's floor where a gap leaves no room at all, km/h (10..60); a wider gap
; is faster in proportion up to 3 m of room a side. The native follower tracks to well under a
; metre at 22.
GapCrawlKmh=22
; Recorded courses use the exact yellow-line nodes, continuous native following and anticipatory bend pacing.
; 0 selects the legacy rolling traffic fallback for the NEXT race, without restarting.
ContinuousRecordedRoutes=1
; Planning estimates, not added grip or physical-force modifiers; read at the next race.
; Larger corner envelope carries more speed. Braking envelope predicts stopping distance only.
CorneringEnvelopeMps2=14
BrakingEnvelopeMps2=6

[RacePrototype]
; Retired diagnostic; ignored. Charles always uses displayed 6-10 and natural acceleration.
CharlesDiagnosticMaxRanks=0
; Test-only host selection for existing fixed courses/F9. Auto keeps each station's Host/default.
