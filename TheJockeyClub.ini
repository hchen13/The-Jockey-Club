ShowcasePlanningTimeoutSeconds=6.0
; Small ground-relative spawn clearance, then allow physics to settle before freezing/mounting.
ShowcaseSpawnLift=0.35
OriginalVariant=2
ActivationMinRadius=110.0
ActivationMaxRadius=215.0
EncounterCleanupRadius=235.0
NaturalReleaseRadius=120.0
FinishRadius=18.0
MaxRaceSeconds=1200

[Stimulant]
; A horse stimulant used DURING a race is the player's burst: for its length the
; mount runs on speed level SpeedLevel (11 = one level past the top of the
; curve) and acceleration level AccelerationLevel, each only if higher than the
; mount's own. The three the game sells last these many seconds at bonding
; level 1, multiplied by the bonding factor of the mount (levels 1..5: the
; game's bonding ranks 0..4, so a fresh horse is level 1, a fully bonded one 5). The
; game's own horse attributes are never written; only the racing curve is.
RegularSeconds=8.0
PotentSeconds=10.0
SpecialSeconds=20.0
SpeedLevel=11
AccelerationLevel=10
BondingFactor1=1.0
BondingFactor2=1.5
BondingFactor3=2.0
BondingFactor4=2.5
BondingFactor5=3.0

; Legacy compatibility key. Completed horse interactions now identify the actual
; dose tier even with infinite items; a gold stamina core is not a consumption trigger.
UncountedDoseTier=potent

[StimulantHud]
; A sixth core beside the game's five: the mod's horseshoe on a black disc, ringed like the game's
; cores, on the same orbit round the radar. It appears with a stimulant's burst in a race and goes
; with it; the ring is the burst left, the whole ring being the longest burst - SpecialSeconds x the
; highest BondingFactor (60 s by default). The arc starts at twelve and runs clockwise, so three quarters
; of the longest burst reaches nine o'clock; as the burst drains its end turns back counter-clockwise,
; through six and three, to twelve. These settings are read again every second, so the core can be
; placed with the game running: Calibrate=1 shows it full at all times. RadarX and RadarY are the
; radar's centre as fractions of the screen and RadarRadius its radius as a fraction of the screen's
; height; the core sits Orbit radar radii from that centre at AngleDegrees (0 is right of the radar,
; negative up). CoreRadius (the black disc), RingThickness and RingGap are in radar radii, IconScale in
; disc radii. The screen is measured from the game's window; ScreenWidth and ScreenHeight override
; that.
Enabled=1
Calibrate=0
RadarX=0.093
RadarY=0.820
RadarRadius=0.135
Orbit=1.44
AngleDegrees=-36
CoreRadius=0.144
RingThickness=0.024
RingGap=0
IconScale=1.3
ColourR=255
ColourG=255
ColourB=255
ScreenWidth=0
ScreenHeight=0
Icon=blip_ambient_horse

[AutoCurve]
; Read again whenever the mod is enabled from F11, as are [Stimulant] and [StimulantHud].
; Nonlinear target-speed curve in km/h. Level 5 is the vanilla reference point.
; The same curve drives the player's mount and every AI horse; what made an AI
; horse of the same rank 2 km/h faster was its gait (3.0 against a rider's 2.9),
; which [AutoCurve] RiderGaitCap now equalises.
SpeedTarget1=44.00
SpeedTarget2=46.04
SpeedTarget3=48.31
SpeedTarget4=50.79
SpeedTarget5=53.50
SpeedTarget6=56.43
SpeedTarget7=59.58
SpeedTarget8=62.95
SpeedTarget9=66.54
SpeedTarget10=70.35

; Natural locomotion ceilings for speed levels 1-4.
LowSpeedBlend1=2.41
LowSpeedBlend2=2.55
LowSpeedBlend3=2.68
LowSpeedBlend4=2.84

; Faster Horse-style forward force for speed levels 6-10.
HighSpeedForce6=1.70
HighSpeedForce7=3.18
HighSpeedForce8=4.77
HighSpeedForce9=6.44
HighSpeedForce10=8.22
; The sprint gait the curve asks of every horse it drives, the player's mount and
; each AI racer alike; 2.90 is what a rider's spurs ask of a mount. Faster Horse
; uses the same number.
TargetDesiredBlend=2.90
; The gait an AI racer may reach. A rider's spurs take the mount to a move blend
; ratio of 2.9; a task-driven horse holds 3.0, and that alone made a jockey of
; the player's rank 2 km/h faster (70.2 against 68.0 km/h, 2026-09-14). 0 = no cap.
RiderGaitCap=0
; The gait the PLAYER's mount may reach follows the bond (2026-09-20): bonding rank 0 and 1 stay native
; (the spurs ask 2.9), rank 2 may reach 2.933, rank 3 2.967, rank 4 the full 3.0 a task-driven horse holds,
; worth about 2 km/h at the same force. While the sprint is held the desired gait is eased towards the target;
; the log says every ten seconds of sprinting whether the game let it stand. 0 turns it off.
PlayerGaitByBonding=1
; The other way to the same speed: no cap, so the AI rider sits the sprint gait
; (the crouch and spurs of a player's mount), and its extra 2.2 km/h taken back
; as force - about 1.1 at the top of the ladder. Force units; 0 = none. To try
; it: RiderGaitCap=0 and RiderForceOffset=1.1 (2026-09-17).
RiderForceOffset=0.0
ForceStartKmh=40.0

; Seconds for acceleration levels 1-4 to fully open their locomotion range.
LowAccelRamp1=12.0
LowAccelRamp2=8.0
LowAccelRamp3=5.0
LowAccelRamp4=2.5

; Desired-gait response for acceleration levels 6-10.
HighAccelResponse6=0.01
HighAccelResponse7=0.02
HighAccelResponse8=0.04
HighAccelResponse9=0.08
HighAccelResponse10=0.15

; Time for the high-speed force to reach full strength after crossing 40 km/h.
ForceRampSeconds1=18.0
ForceRampSeconds2=15.0
ForceRampSeconds3=12.5
ForceRampSeconds4=10.5
ForceRampSeconds5=8.5
ForceRampSeconds6=7.0
ForceRampSeconds7=5.5
ForceRampSeconds8=4.0
ForceRampSeconds9=2.3
ForceRampSeconds10=0.5
; Hysteresis on the force gate. Force engages at ForceStartKmh and keeps pulling
; down to ForceHoldKmh; only a dip below ForceResetKmh lasting ForceResetSeconds
; discards the ramp already earned. Set ForceHoldKmh=40 and ForceResetSeconds=0
; to restore the old single-edge behaviour without a rebuild.
ForceHoldKmh=33.0
ForceResetKmh=30.0
ForceResetSeconds=1.0
RampStartBlend=1.50
OpenBlend=3.20

[Cues]
; Reviewed camp selections plus Thoroughbred American Venom #09 / Cruel, Cruel World.
; Plays the installed game's original resources. No additional audio files.
NativeRacePlaylist=1
; Short one-shot cues. Each pair is a sound name and the soundset it lives in.
; The defaults all ship in the game's own scripts, so they exist; swap either
; half to try another and restart the game. PLAY_SOUND_FRONTEND reports nothing,
; so an unknown name is simply silent rather than an error.
; Played once per visible countdown second.
CountdownSound=Small_Safe_Tumbler
CountdownSoundSet=Mud5_Sounds
; Played the moment the field is released.
StartSound=HUD_DRAW
StartSoundSet=HUD_DUEL_SOUNDSET
; Played when the player completes a lap.
LapSound=choice_appears
LapSoundSet=mud5_sounds
; A playlist of the game's own music events in place of the race score, played in order and round again.
; A piece is a chain of the score's own stage events, each with its seconds: "WNT1_START@20>WNT1_ACTION@220"
; plays the intro stage for 20 s and the action stage for 220 s (5..1800; 180 when unsaid - a mission's
; score loops until its next event, so a length has to be chosen). The chain is how a piece fades in, the
; mission's own way, and it is the only way: no native ramps a music volume, and the mod will not invent an
; event name to coax a silent stage into starting - a name built from a prefix is not a name the game has
; agreed to. A stage that is still silent six seconds after its trigger is given up and the piece moves on.
; Empty: the vanilla REHR_START.
; A piece ends with its own mission's stop event: "|WNT4_STOP" after the stages (<code>_STOP when unsaid;
; the game's eight-second STOP_MUSIC_8S only if that is refused), and the next piece starts eight seconds
; later. It has to be the mission's own: on 2026-09-20 at 18:34, after STOP_MUSIC_8S the next piece's stage
; event was accepted and nothing sounded - the music system had been told to stop, and a stage event alone
; did not start it again.
; RaceMusicPlaylistStations names the corridor stations it plays for (empty: every hosted race).
; Confirmed by ear on 2026-09-20: WNT4_START is the prologue train heist's song (BOB_WINTER_4_SONG_2, 4:10,
; needs no fade-in). Which stage of a score carries which piece is a matter of listening, so audition a name
; below before putting it in the list.
RaceMusicPlaylist=WNT4_START@150|WNT4_STOP,RGNG01_RIDE_START@200|RGNG01_RIDE_STOP,FIN1_CAMP_RIDE_HIGH@248|FIN1_STOP
RaceMusicPlaylistStations=arthur-camp-duel
; Outside a race: set a music event name here and it plays within two seconds (the previous one is cancelled);
; the log says whether any music is playing four seconds later. Blank it to stop. Candidates for the prologue
; fight: WNT1_ACTION WNT1_COVER WNT1_BARN WNT1_RUNS WNT1_START, with WNT1_PRE_INTRO or WNT1_INTRO ahead of
; one of them as an intro stage; for the train heist: WNT4_START WNT4_MOVE WNT4_TRAIN_JUMP WNT4_SHOOTOUT
; WNT4_DYNAMITE; later train robberies: TRN1_START TRN1_HORSE_CHASE TRN4_START TRN4_TRAIN_CHASE
; TRN4_GATLING_1. For "Lemoyne (Inst.)", which a chroma fingerprint matched to layer 1 of BOB_BRAITHWAITES_1
; (chapter 3, "Advertising, the New American Art"; the album track is that 2:44 layer looped to 4:16), the
; stage that carries the layer is unknown: try BRT1_TO_SALOON first, then BRT1_START BRT1_AT_MANOR
; BRT1_TO_WAGON.
AuditionEvent=
; Every horse rears as it is released. 0 turns the rear off.
StartRear=1
; Seconds the player's own controls stay disabled after GO so their mount
; finishes a longer rear and they leave last. 0 removes the handicap. Max 3.
PlayerRearSeconds=0
; A ped beside the grid raises a Cattleman and fires it into the air on GO.
; 0 removes him. He is registered with the street clearance and removed
; off-camera once the field has left.
StarterShot=1
; TASK_HORSE_ACTION has two documented rear-up animations, 1 and 5. Neither
; takes a duration; giving the player one and the field the other is what makes
; his visibly longer. Swap them if it looks backwards. Only 1 and 5 are accepted.
PlayerRearAction=5
; Fourth argument of TASK_HORSE_ACTION: an animation variant. A shipped script
; uses action 5 and action 7 with variant 1, everything else with variant 0.
; Observed: action 1 and 5 at variant 0 are the SAME short cliff-edge rear.
PlayerRearVariant=0
; Rivals rear BEFORE the countdown ends - each its own random draw of up to
; this many seconds early, in hundredths - and each draws one of the verified
; action/variant combinations, so a field does not rise as one. Delaying them
; past GO only handed the player a second of free riding.
NpcRearLead=0.2
; The player rears this long after GO, once the field is already moving...
PlayerRearDelay=0
; Try one action on the whole field instead of the random draw above.
; 0 = keep the draw. Documented actions that do not dismount anyone:
;   1, 5, 7 = rear up (all the same ~3 s animation; 7 does nothing)
;   3 = QUICK_STOP, 8 = SKID - the parts a cliff-edge stop is made of.
; A shipped ambush script uses 8 on the player's own mount. Note both may need
; the horse to be MOVING, and the grid is standing still.
NpcRearAction=0
NpcRearVariant=0

