; paint-course-stitched.jsonl: 4922 samples, 5191 m ridden.
; Geometry only; idle time and riding speed are not replayed. Stationary head and tail of the
; capture trimmed: 0 samples at the start and 0 at the end were the rider holding still.
; Single trip: one recorded ride, start to finish, no lap and no ring.
;
; American Paints only, 5.2 km across Big Valley: the line starts by Hawks Eye
; Creek and ends south of the Dakota River. The ride was recorded in five pieces
; on 2026-09-22 and stitched by tools/stitch_segments.py (the seams are 0.8-2.2 m
; apart and turn 0-8 degrees).
;
; Thinned at 0.3 m with no leg over 8 m, not the 1.5 m / 25 m the other courses
; use: this ride has switchbacks, and at 25 m legs the magenta line met them as a
; 102-degree corner (the user, 2026-09-22). At 8 m the sharpest joint is 72
; degrees, which is the turn itself, and the 95th percentile is 21 rather than 47.
; Eight is also what BuildRacingLine subdivides to, so the solver adds nothing,
; and 924 nodes is inside the 1024 the engine's own waypoint recording holds -
; 1168 was not, and the race was cancelled at the flag for it (2026-09-23 02:08).
;
; Rains Fall hosts on the grey overo and five jockeys ride the other three coats,
; so two of the five share a coat with someone - the user asked for the bigger
; field knowing that. No speed burst: only Sadie, Arthur and John race with one.
; The player must bring a Paint too.

