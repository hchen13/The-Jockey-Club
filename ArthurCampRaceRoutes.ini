; Arthur's Thoroughbred stakes race at Horseshoe Overlook.
; Built from three recorded rides on 2026-09-16 - the first lap, a regular lap
; and the final lap - simplified to 1.5 m. Every lap is a whole recorded ride
; (Mode=RecordedLaps), which is why the finish may lie past the start line
; instead of being it.
;
; Lock on to Arthur in his camp: the paid race and the free practice are his
; two prompts, as with every other host.

[Route]
Mode=RecordedLaps
Host=Arthur
Title=Arthur's Stakes Race
TitleZh=亚瑟的锦标赛
StartPoint=arthur_camp_start_01
FinishPoint=arthur_camp_finish_01
; Thoroughbreds only: Arthur draws Blood Bay or Reverse Dapple Black first;
; the six jockeys take the remaining six coats, including Silver Bay.
; John inherits this field with his own two-host-mount draw; the player brings a Thoroughbred too.
Breed=Thoroughbred
FieldMin=6
FieldMax=6
; Each jockey draws speed from the current host's ability band (Arthur 10,
; John 6..10 by default); acceleration always stays at the horse's own value.
; Arthur himself, the hardest opponent in the mod: his ranks and his cornering
; are his own [OpponentDifficulty] entry and the shared envelope on F11's NPC
; attributes page, as at every other station.
; His earned edge: a whole speed level, as much as the player's stimulant, and
; one burst lasts ten seconds before he has to earn the next by galloping flat
; out again. 0 would hold it for as long as he gallops, which is Sadie's +0.5.
HostSpeedLevelBonus=1.0
HostBoostSeconds=10
; Eight on the grid, two abreast: Arthur in the front row, the player in the last.
GridWidth=2
; The course is policed for the whole race, not only at the start.
ContinuousClearance=1
; Price the frozen full lap count against Valentine three laps.
RewardMultiplier=Distance
StakeMultiplier=Distance
GridHeading=229.676

